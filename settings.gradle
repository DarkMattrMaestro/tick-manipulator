buildscript() {
    repositories {
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
        }
        maven {
            name = "Puzzles Releases"
            url = "https://maven.puzzleshq.dev/releases/"
        }
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
    }
    dependencies {
        classpath("dev.puzzleshq:jigsaw-suite:$puzzle_jigsaw_suite")
        classpath("io.github.spair:imgui-java-app:1.90.0")
    }
}

rootProject.name = "TickManipulator"
